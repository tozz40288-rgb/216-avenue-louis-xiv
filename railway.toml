[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@10 && (export PATH=\"$(npm config get prefix)/bin:$PATH\" && pnpm install --frozen-lockfile && BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/boutique run build && pnpm --filter @workspace/api-server run build)"

[deploy]
startCommand = "sh scripts/start-prod.sh"
healthcheckPath = "/api/healthz"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
