[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@10 && (export PATH=\"$(npm config get prefix)/bin:$PATH\" && pnpm install --frozen-lockfile && BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/boutique run build && pnpm --filter @workspace/db run push && pnpm --filter @workspace/api-server run build)"
[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
