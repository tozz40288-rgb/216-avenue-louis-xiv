[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["npm install -g pnpm@10 && ln -sf $(npm config get prefix)/bin/pnpm /usr/local/bin/pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/boutique run build"]

[start]
cmd = "npx serve -s artifacts/boutique/dist -l $PORT"
